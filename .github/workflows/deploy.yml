name: Publish the app

# Serves the SpindleLabs app (built from SpindleLabs-app/SpindleLabs main, the same
# build as spindlelabs.app) at https://spindlelabs-app.github.io/, a second address
# for networks that block the custom domain. Checks every hour and rebuilds
# only when SpindleLabs' main has moved on. Only already-public files are
# used: the app source and the kernel release build committed in SpindleLabs.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      only_if_new:
        description: "Rebuild only when SpindleLabs' main has moved on (what clock.yml asks for)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          ONLY_IF_NEW: ${{ inputs.only_if_new }}
        run: |
          sha=$(git ls-remote https://github.com/SpindleLabs-app/SpindleLabs refs/heads/main | cut -f1)
          live=$(curl -fsS https://spindlelabs-app.github.io/build-sha.txt || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$live" ] && { [ "$EVENT" = schedule ] || [ "$ONLY_IF_NEW" = true ]; }; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SpindleLabs-app/SpindleLabs
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # The same build as spindlelabs.app: without the ?test-hooks debug surface, and
      # the publish stops if any of it is left in the files.
      - run: npm run build
        working-directory: apps/fission
        env:
          FISSION_NO_TEST_HOOKS: "1"
      - run: |
          if grep -rlE 'fissionTest|__noTooltips' apps/fission/dist; then
            echo "The debug surface is in the build" >&2
            exit 1
          fi
      # The moderators' review page (community C5b), at /review/, for a moderator with no terminal. It is plain
      # files written from SpindleLabs' supabase/review, never part of the app's build; the page holds no secret
      # and the moderation function checks every request against its list. Skipped for a main without it.
      - run: |
          if [ -f supabase/review/build.mjs ]; then node supabase/review/build.mjs apps/fission/dist/review; fi
      # The CNAME names spindlelabs.app, which this address must not claim.
      - run: |
          rm -f apps/fission/dist/CNAME
          echo "${{ needs.check.outputs.sha }}" > apps/fission/dist/build-sha.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/fission/dist
          # dist/.well-known/ starts with a dot; without this it is left out and the
          # offline copy, which lists it, can never install here.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
